global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "imagedb-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    scrape_interval: 10s

  - job_name: "imagedb-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
    scrape_interval: 15s

  - job_name: "imagedb-processing"
    metrics_path: /metrics
    static_configs:
      - targets: ["processing:8002"]
    scrape_interval: 15s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
